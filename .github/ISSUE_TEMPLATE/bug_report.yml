name: Bug report
description: Report a reproducible NyxWhisper problem.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de ne pas joindre d'audio ou de transcription privee.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open NyxWhisper
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - CPU
        - CUDA
        - Vulkan
        - Unsure
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: version
    attributes:
      label: NyxWhisper version/build
      placeholder: 0.1.0 / installer / local build
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only reviewed/redacted log lines from %APPDATA%\NyxWhisper\NyxWhisper.log.
      render: text

